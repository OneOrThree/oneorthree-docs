<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="1760" height="1220" fill="#ffffff"/>
<text x="60" y="58" font-size="32" fill="#172b3a" font-weight="700">Cattus · 서비스 아키텍처</text>
<text x="60" y="92" font-size="17" fill="#4d5a66" font-weight="400">2026.11.03 · phone main af80af042 · 코드와 저장소 운영 기록 대조 · 새 운영 실측 아님</text>
<rect x="40" y="140" width="1680" height="310" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="174" font-size="19" fill="#334d61" font-weight="700">공개 HTTP와 제품 정본</text>
<text x="64" y="201" font-size="16" fill="#4d5a66" font-weight="400">Business는 공개 계약, Data는 현재 권한·원자 명령·제품 데이터의 정본을 맡는다.</text>
<rect x="40" y="480" width="1680" height="310" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="514" font-size="19" fill="#334d61" font-weight="700">채팅과 실시간</text>
<text x="64" y="541" font-size="16" fill="#4d5a66" font-weight="400">현재 앱의 단체 채팅은 REST·10초 폴링. STOMP의 채널별 권한은 별도다.</text>
<rect x="40" y="820" width="1680" height="310" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="854" font-size="19" fill="#334d61" font-weight="700">커밋된 사건과 알림</text>
<text x="64" y="881" font-size="16" fill="#4d5a66" font-weight="400">전달 성공·소비 성공·기기 도착은 각각 다른 단계다. 플래그 기본값과 운영값도 구분한다.</text>
