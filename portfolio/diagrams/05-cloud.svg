<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">Cattus · AWS 운영 V2</title>
<desc id="diagramDesc">2026.11.03 · phone main af80af042 · 코드와 저장소 운영 기록 대조 · 새 운영 실측 아님</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607583"/></marker></defs>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="1760" height="1220" fill="#ffffff"/>
<text x="60" y="58" font-size="32" fill="#172b3a" font-weight="700">Cattus · AWS 운영 V2</text>
<text x="60" y="92" font-size="17" fill="#4d5a66" font-weight="400">2026.11.03 · phone main af80af042 · 코드와 저장소 운영 기록 대조 · 새 운영 실측 아님</text>
<rect x="40" y="140" width="1680" height="310" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="174" font-size="19" fill="#334d61" font-weight="700">공개 진입과 서버</text>
<text x="64" y="201" font-size="16" fill="#4d5a66" font-weight="400">현재 배치는 저장소 운영 기록 기준이며 이 도면 자체가 호스트 가용성 검사는 아니다.</text>
<rect x="40" y="480" width="1680" height="310" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="514" font-size="19" fill="#334d61" font-weight="700">분리한 런타임과 저장소</text>
<text x="64" y="541" font-size="16" fill="#4d5a66" font-weight="400">Kafka와 Redis는 각자 EC2. RDS는 기존 운영 인스턴스를 계속 사용한다.</text>
<rect x="40" y="820" width="1680" height="310" rx="18" fill="#f8fafc" stroke="#dce4eb"/>
<text x="64" y="854" font-size="19" fill="#334d61" font-weight="700">운영 지원과 변경 경로</text>
<text x="64" y="881" font-size="16" fill="#4d5a66" font-weight="400">운영 기록의 Agent health와 Datadog 최신 수신 상태는 구분한다.</text>
<g data-cell-id="edgeEntry"><path d="M 520 315 L 655 315" fill="none" stroke="#607583" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="543.0" y="289" width="88.0" height="23" rx="4" fill="#ffffff"/>
<text x="587" y="305" font-size="14" text-anchor="middle" fill="#405768">HTTPS/WSS</text>
</g>
<g data-cell-id="appEntry"><path d="M 1105 315 L 1240 315" fill="none" stroke="#607583" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1142.25" y="289" width="59.5" height="23" rx="4" fill="#ffffff"/>
<text x="1172" y="305" font-size="14" text-anchor="middle" fill="#405768">라우팅</text>
</g>
