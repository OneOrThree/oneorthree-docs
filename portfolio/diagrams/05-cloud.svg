<text x="675" y="289" font-size="16" fill="#4d5a66" font-weight="400">공개 주소·TLS·라우팅</text>
<text x="675" y="313" font-size="16" fill="#4d5a66" font-weight="400">HTTP는 Business로 전달</text>
<text x="675" y="337" font-size="16" fill="#4d5a66" font-weight="400">WSS는 Realtime으로 전달</text>
<text x="675" y="405" font-size="14" fill="#607583" font-weight="700">내부 API는 앱 진입점 아님</text>
